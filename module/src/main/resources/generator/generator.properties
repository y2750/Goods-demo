# 修改这里即可切换数据库、表名、包名和输出位置。
# 相对路径以项目根目录（包含 module/pom.xml 的目录）为基准。
datasource.properties=console/src/main/resources/application.properties
tables=user
author=ny
parent.package=com.example.mall.module
table.prefix=

# 直接输出到 module/src/main/java 和 module/src/main/resources/mapper。
# 已存在的文件会跳过，不自动覆盖。
output.root=module

# Controller 使用独立包名和输出模块；改成 app/com.example.mall.app.controller 可生成到 app。
controller.enabled=true
controller.output-root=console
controller.package=com.example.mall.console.controller
# 详情/列表不返回这些 Java 属性（删除标记始终不返回）。
controller.hidden-fields=password,passwordHash,salt

# 当前规范：单个自增整数主键、秒级整数时间戳、0/1逻辑删除字段。
column.create-time=create_time
column.update-time=update_time
column.deleted=is_deleted
